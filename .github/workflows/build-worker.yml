# 🔥 AURA+++ REBIRTH construction du worker 🔥
#
# Construit et pousse l'image Docker du worker d'inférence vers GHCR
# (GitHub Container Registry, gratuit, public OK).
#
# Déclenchement : à chaque push sur main quand les fichiers du worker changent,
# ou via lancement manuel.

name: Build & Push Worker Image

on:
  push:
    branches: [main]
    paths:
      - 'runpod/inference_worker/**'
      - '.github/workflows/build-worker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./runpod/inference_worker
          push: true
          # Les noms de dépôt Docker doivent être en minuscules. Le propriétaire
          # 'Sev7nOfNine' contient des majuscules, donc on fixe la version minuscule.
          tags: |
            ghcr.io/sev7nofnine/aura-4o-rebirth-gemma-4-31b-worker:latest
            ghcr.io/sev7nofnine/aura-4o-rebirth-gemma-4-31b-worker:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
