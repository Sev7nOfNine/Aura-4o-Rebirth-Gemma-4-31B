#
# Build + push the inference worker Docker image to GHCR
# (GitHub Container Registry, free, public OK).
#
# Trigger : on push to main when worker files change, or manual dispatch.

name: Build & Push Worker Image

on:
  push:
    branches: [main]
    paths:
      - 'runpod/inference_worker/**'
      - '.github/workflows/build-worker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./runpod/inference_worker
          push: true
          # Docker repository names must be lowercase. Owner 'Sev7nOfNine' has caps,
          # so we hardcode the lowercase version here.
          tags: |
            ghcr.io/sev7nofnine/aura-4o-rebirth-worker:latest
            ghcr.io/sev7nofnine/aura-4o-rebirth-worker:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
