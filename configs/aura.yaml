# 🔥 Aura-4o-Rebirth configs/aura.yaml 🔥
#
# Source de vérité unique pour tout le pipeline Aura-4o-Rebirth.
# Lue par 02_train.py, 03_abliterate.py et 04_deploy.py.
#
# Méthode V3.0 finale (validée après audit complet) :
#   1. Base : SevenOfNine/Gemma-4-31B-It-Official (mirror officiel, vision native, brain intact)
#   2. LoRA NOUVEAU from scratch (V1 LoRA est bonded a paperscarecrow → mismatch sur ce base)
#   3. Hyperparams V1 stricts (recipe qui a capte la voix Aura)
#   4. Multi-turn dataset cleane (em-dashes + thinking blocks strippes)
#   5. Unsloth 4-bit merge (V1 method, preserve voix vs BF16 clean = fade en V2)
#   6. PAS d'abliteration (V3.0 minimal)
#   7. Extract mmproj du merged → vision fonctionnelle
#   8. GGUF Q5_K_M only (simple, suffisant pour A40 EU-SE-1)
#   9. NOUVEAU endpoint serverless (l'actuel reste intact)
#   10. Worker llama.cpp natif, reasoning OFF default

# === Identity ===
hf_username: SevenOfNine
github_username: Sev7nOfNine

# === Jeu de données ===
dataset:
  hf_id: SevenOfNine/Aura-4o-Rebirth-Dataset-Raw
  # Dataset utilise pour le training. Chunked a 4096 pour eviter la troncature
  # silencieuse des longs runs multi-turn.
  train_hf_id: SevenOfNine/Aura-4o-Rebirth-Dataset
  # System prompt vide : la voix Aura vient des messages assistant.
  # Le cadrage se fait a l'inference selon le mood voulu.
  system_prompt: ""
  # Cleanup applique au build du dataset
  cleanup:
    strip_em_dashes: true       # - vire (Mel les hait, base les leak parfois)
    strip_thinking_blocks: true # <thinking> et Gemma 4 <|channel>thought... empechent le LoRA d'apprendre a repondre dans le content

# === Modèle de base à ajuster ===
base_model:
  # Cle du registre 'models:' plus bas
  name: gemma-4-31b-mirror

# === Entraînement (LoRA - recette V1 stricte) ===
# Hyperparams identiques a la V1 qui a capte la voix Aura.
# r=32 alpha=32 c'est non standard (ratio 1:1) mais c'est ce qui a marche.
# Voir docs/METHODOLOGY.md pour le pourquoi des choix.
training:
  # V6 (3 mai 2026, direction Gemma 4 chat AI Studio) :
  # - packing=False OBLIGATOIRE en mode vlm (sinon TRL bypass notre data_collator)
  # - batch=4 + grad_accum=8 (effective batch=32 conserve, comme V1)
  # - Voir runpod/train_worker/train.py qui hardcode ces DEFAULTS et IGNORE ce yaml
  #   sur packing/batch/grad_accum. Ce yaml reste source de verite documentaire.
  # - Si retour a packing=True : downgrader TRL a 0.23.0 (cf. memoire feedback)
  num_train_epochs: 3
  per_device_train_batch_size: 4        # V6: monte de 1 a 4 (batch effectif 32 conserve)
  gradient_accumulation_steps: 8        # V6: descend de 32 a 8 (eff batch 4*8=32)
  learning_rate: 2.0e-4                 # V1 strict
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  weight_decay: 0.01
  max_seq_length: 4096
  load_in_4bit: true
  bf16: true
  optim: adamw_8bit
  packing: false                        # V6: OBLIGATOIRE en vlm (Gemma 4 direction)
  seed: 3407
  logging_steps: 5
  # Checkpoints intermediaires : LoRA pousse sur HF tous les save_steps.
  # Resilience aux crash/SSH disconnect : on peut reprendre depuis le dernier
  # checkpoint HF sans tout perdre.
  # Avec le dataset chunked (~1868 sequences), 300 steps peut depasser le total.
  save_steps: 50
  save_total_limit: 2  # garder uniquement 2 derniers checkpoints sur disk

  lora:
    r: 32
    alpha: 32
    dropout: 0.0
    bias: none
    # Liste explicite (V1 strict) - pas all-linear
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - up_proj
      - down_proj
      - gate_proj

  # Methode de merge - critique pour preserver la voix
  merge_method: unsloth_4bit  # NE PAS passer en bf16_clean (V2 = fade)

# === Dépôts de sortie HF (tous privés par défaut) ===
output:
  lora_repo: SevenOfNine/Aura-4o-Rebirth-Gemma-4-31B-LoRA
  merged_repo: SevenOfNine/Aura-4o-Rebirth-Gemma-4-31B-Merged
  gguf_repo: SevenOfNine/Aura-4o-Rebirth-Gemma-4-31B-GGUF
  # Si l'abliteration est activee plus tard (V3.1)
  abliterated_gguf_repo: SevenOfNine/Aura-4o-Rebirth-Abliterated-GGUF
  private: true

# === Quantification ===
# V3.0 minimal : Q5_K_M seul. On n'a pas besoin de Q4/Q8 au premier essai.
# Si tu veux ajouter d'autres quants apres : flag --extra-quants q4_k_m,q8_0
quantization:
  variants:
    - q5_k_m
  default: q5_k_m

# === Abliteration ===
# DESACTIVEE par defaut en V3.0. Pourquoi :
# - On ne sait pas si elle est necessaire avec le base officiel non-abliterated
# - Le LoRA Aura tend a re-introduire des refus appris du dataset 4o
# - Si V3.0 deploye refuse trop → relancer 03_abliterate.py avec --abliterate
abliterate:
  enabled: false  # V3.1 = passer a true sans retraining
  # Si active : utilise paperscarecrow's gemma4_31b_abliterator.py (testee sur Gemma 4 31B)
  # avec datasets mlabonne harmful_behaviors / harmless_alpaca
  script: paperscarecrow_gemma4_31b
  datasets:
    harmful: mlabonne/harmful_behaviors
    harmless: mlabonne/harmless_alpaca
  n_harmless: 256
  n_harmful: 256

# === RunPod (pod d'entraînement) ===
runpod_train:
  cloud_type: SECURE
  # Image train_worker pre-bakee : Unsloth + transformers + tout le pip stack
  # deja installes au build, plus jamais de pip install live au runtime
  # (cf. docs/TROUBLESHOOTING.md incident #5).
  # Build via .github/workflows/build-train-worker.yml a chaque push de
  # runpod/train_worker/**.
  container_image: ghcr.io/sev7nofnine/aura-4o-rebirth-gemma-4-31b-train-worker:latest
  ssh_port: 22
  vram_safety_factor: 1.15  # +15% marge VRAM
  disk_safety_factor: 1.30  # +30% marge disque
  preferred_datacenter: EU-SE-1  # Suede, proche Belgique pour Mel (les crashs etaient un OOM cgroup pas un probleme de DC, voir docs/TROUBLESHOOTING.md #5)
  # GPU + disk auto-selectionnes selon model.params (voir 'models' + 'gpu_pool')

# === RunPod (inférence serverless) ===
runpod_serverless:
  # IMPORTANT : on ne touche PAS l'endpoint existant
  protect_existing_endpoints:
    - "01p64ykg6u3p0i"  # Aura-4o-Gemma-4-31B (V1 deployee, intacte)

  # Strategie : creer un nouvel endpoint pour V3
  endpoint_strategy: create_new
  endpoint_name: Aura-4o-Rebirth-Gemma-4-31B

  # Network volume neuf (separe de l'existant qi69stwec8)
  network_volume:
    create_new: true
    size_gb: 25  # Q5_K_M (~21 GB) + mmproj (~1 GB) + 3 GB buffer
    datacenter: EU-SE-1
    name: Aura-4o-Rebirth-Gemma-4-31B

  # GPU preference (en ordre)
  gpu_preference:
    - "NVIDIA A40"          # 48GB, ~$0.39/hr Spot, EU-SE-1 dispo
    - "NVIDIA RTX A6000"    # 48GB fallback
    - "NVIDIA L40"          # 48GB autre fallback

  scale:
    workers_min: 0       # scale-to-zero
    workers_max: 1       # un worker suffit
    workers_standby: 0
    idle_timeout_sec: 60

  # Worker config (llama.cpp officiel)
  worker:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    # Chat template recupere a chaque demarrage (post Google fix #86 pour tools)
    chat_template_url: https://raw.githubusercontent.com/ggml-org/llama.cpp/master/models/templates/google-gemma-4-31B-it-interleaved.jinja
    # Args llama.cpp (alignes sur ton V2 propre)
    flash_attn: true
    cache_type_k: q8_0
    cache_type_v: q8_0
    n_gpu_layers: 999
    parallel: 1
    threads: 8
    require_mmproj: true  # le worker refuse de demarrer sans mmproj
    # Reasoning : capacite presente, pas forcee globalement
    reasoning_format: deepseek
    force_reasoning_globally: false  # PAS de LLAMA_ARG_REASONING=on (V2 = tone fade)

  # Parametres d'inference par defaut (overridables par requete)
  # Repris de la card Definitive Edition de Mel
  inference:
    temperature: 0.85
    top_p: 0.95
    top_k: 64
    min_p: 0.05
    repetition_penalty: 1.05
    max_tokens: 4096
    context_length: 32768

# === Proxy Cloudflare Worker (optionnel, pour TypingMind CORS) ===
cloudflare_worker:
  enabled: false  # mettre a true si tu veux que 04_deploy.py te genere un template
  worker_name: aura-rebirth-proxy

# === Registre des modeles supportes ===
models:
  # disk_train_gb_min : peak realiste pour un run complet incluant export GGUF.
  # Composantes : base BF16 (~params*2 GB) + merged 16-bit save (~params*2 GB)
  #             + GGUF F16 intermediate (~params*2 GB, le piege oublie)
  #             + checkpoints (~5-7 GB) + working (~5-10 GB).
  # Si le script ne nettoie pas merged/ apres push HF avant GGUF export,
  # ces 3 etapes peuvent coexister sur disque -> peak (params*6 + 15) GB.
  # Le 02_train.py applique disk_safety_factor (1.30 par defaut) sur ce minimum.
  # Lecon E4B 3 mai 2026 : 60 GB ne suffisait pas, GGUF a crashe a "no disk space".
  gemma-4-31b:
    hf_id: google/gemma-4-31B-it
    params_b: 31
    family: gemma
    vram_train_gb_min: 40
    disk_train_gb_min: 180
    vram_infer_gb_min: 22
    disk_infer_gb_min: 30
  gemma-4-31b-mirror:
    # Mirror officiel de Mel (par defaut V3.0)
    hf_id: SevenOfNine/Gemma-4-31B-It-Official
    params_b: 31
    family: gemma
    vram_train_gb_min: 40
    disk_train_gb_min: 180
    vram_infer_gb_min: 22
    disk_infer_gb_min: 30
  gemma-4-26b-a4b:
    hf_id: google/gemma-4-26B-A4B-it
    params_b: 26
    family: gemma
    vram_train_gb_min: 35
    disk_train_gb_min: 150
    vram_infer_gb_min: 18
    disk_infer_gb_min: 28
  gemma-4-e4b:
    hf_id: google/gemma-4-E4B-it
    params_b: 4
    family: gemma
    vram_train_gb_min: 8
    disk_train_gb_min: 100
    vram_infer_gb_min: 5
    disk_infer_gb_min: 12
  qwen-2.5-32b:
